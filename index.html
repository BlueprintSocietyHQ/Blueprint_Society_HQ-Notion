<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Notion Templates</title>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #000000; --gray: #f4f4f4; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        header { text-align: center; padding: 100px 20px; }
        h1 { font-size: 3rem; font-weight: 800; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 1.2rem; }
        
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; }
        
        .card { background: var(--gray); border-radius: 12px; overflow: hidden; transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #ddd; }
        .card-content { padding: 24px; }
        .card-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
        
        .btn { display: inline-block; background: var(--accent); color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 15px; }
        .btn:hover { opacity: 0.9; }
    </style>
</head>
<body>

<header>
    <h1>Notion Templates</h1>
    <p class="subtitle">Premium systems to organize your life and work.</p>
</header>

<div class="container">
    <div class="grid">
        <!-- Template Card 1 -->
        <div class="card">
            <img src="https://drive.google.com/file/d/1infHQP8y-xt3hCIjoN1-ZM_ezb6Zf9z2/view?usp=sharing" alt="Second Brain" class="card-img">
            <div class="card-content">
                <div class="card-title">Second Brain</div>
                <p>A complete digital system to capture ideas and manage projects.</p>
                <a href="https://beacons.ai/yourusername" class="btn">Get Template</a>
            </div>
        </div>

        <!-- Template Card 2 -->
        <div class="card">
            <img src="template2.jpg" alt="Finance Tracker" class="card-img">
            <div class="card-content">
                <div class="card-title">Finance Tracker</div>
                <p>Track your income, expenses, and monthly budgets effortlessly.</p>
                <a href="https://beacons.ai/yourusername" class="btn">Get Template</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
